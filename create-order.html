<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ThaiGo Air Express</title>
<style>
body{
  font-family: Arial;
  background:#0f2a4a;
  padding:20px;
}
.container{
  background:#fff;
  padding:20px;
  border-radius:12px;
  max-width:400px;
  margin:auto;
}
input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:12px;
  background:#1e3a8a;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
}
.result{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<h2>คำนวณค่าส่ง</h2>

<label>ประเทศ</label>
<select id="country">
<option value="USA">USA</option>
</select>

<label>น้ำหนัก (kg)</label>
<input type="number" id="weight">

<label>ยาว (cm)</label>
<input type="number" id="length">

<label>กว้าง (cm)</label>
<input type="number" id="width">

<label>สูง (cm)</label>
<input type="number" id="height">

<button onclick="calculate()">คำนวณราคา</button>

<div class="result" id="result">กำลังโหลดราคา...</div>

</div>

<script>
let pricing = {};

async function loadPricing(){
  const url = "https://opensheet.elk.sh/1bkT93uDRhnTeb_nFzKWXsTbtDhGKbl-B_TNf_4gIX4Y/pricing_master";
  let res = await fetch(url);
  let data = await res.json();

  data.forEach(row => {
    let country = row.country;
    let weight = parseFloat(row.weight);
    let price = parseFloat(row.price);

    if(!pricing[country]){
      pricing[country] = {};
    }

    pricing[country][weight] = price;
  });

  document.getElementById("result").innerHTML = "พร้อมใช้งานแล้ว";
}

loadPricing();

function calculate(){
  let country = document.getElementById("country").value;
  let w = parseFloat(document.getElementById("weight").value) || 0;
  let l = parseFloat(document.getElementById("length").value) || 0;
  let wi = parseFloat(document.getElementById("width").value) || 0;
  let h = parseFloat(document.getElementById("height").value) || 0;

  let vol = (l * wi * h) / 5000;
  let charge = Math.max(w, vol);
  charge = Math.ceil(charge * 10) / 10;

  let table = pricing[country];

  if(!table){
    document.getElementById("result").innerHTML = "ยังไม่มีราคาประเทศนี้";
    return;
  }

  let keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let finalWeight = keys.find(k => k >= charge) || keys[keys.length-1];
  let price = table[finalWeight];

  document.getElementById("result").innerHTML =
  `น้ำหนักคิดราคา: ${charge} kg <br> ราคาค่าส่ง: ${price} บาท`;
}
</script>
</body>
</html>
