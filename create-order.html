<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiGo Air Express</title>

<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#0f2a4a,#1e3a8a);
  margin:0;
  padding:20px;
}

.container{
  background:#fff;
  padding:25px;
  border-radius:18px;
  max-width:420px;
  margin:auto;
  box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.logo{
  text-align:center;
  margin-bottom:10px;
}

.logo h1{
  color:#1e3a8a;
  margin:0;
  font-size:28px;
}

.logo span{
  color:#c9a54c;
  font-weight:bold;
}

h2{
  text-align:center;
  margin-top:5px;
}

.sub{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}

.row{
  display:flex;
  gap:8px;
}

button{
  width:100%;
  padding:14px;
  background:linear-gradient(90deg,#1e3a8a,#0f2a4a);
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

.result{
  margin-top:15px;
  background:#f3f4f6;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.badge{
  color:green;
  margin-top:8px;
  font-weight:bold;
}

.line-btn{
  display:block;
  margin-top:15px;
  text-align:center;
  background:#06c755;
  color:#fff;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  font-size:15px;
}

.trust{
  margin-top:10px;
  text-align:center;
  font-size:13px;
  color:#444;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<h1>ThaiGo</h1>
<span>AIR EXPRESS</span>
</div>

<h2>Shipping Calculator</h2>
<div class="sub">Fast • Reliable • Worldwide</div>

<label>Destination</label>
<select id="country"></select>

<label>Weight (kg)</label>
<input type="number" id="weight" placeholder="e.g. 1">

<div class="row">
<input type="number" id="length" placeholder="Length">
<input type="number" id="width" placeholder="Width">
<input type="number" id="height" placeholder="Height">
</div>

<button onclick="calculate()">✈️ Calculate Price</button>

<div class="result" id="result">Loading price...</div>

<a href="https://lin.ee/xfm469D">
🚀 Start Shipping via LINE
</a>

<div class="trust">
✔ No hidden fees • ✔ Tax included • ✔ Real support
</div>

<div class="footer">
📦 Delivery 3-7 days worldwide
</div>

</div>

<script>
let pricing = {};

async function loadPricing(){
  const url = "https://opensheet.elk.sh/1bkT93uDRhnTeb_nFzKWXsTbtDhGKbl-B_TNf_4gIX4Y/pricing_master";

  let res = await fetch(url);
  let data = await res.json();

  let countries = new Set();

  data.forEach(row => {
    let country = row.country;
    let weight = parseFloat(row.weight);
    let price = parseFloat((row.price || "0").replace(/,/g,''));

    if(!country || isNaN(weight) || isNaN(price)) return;

    countries.add(country);

    if(!pricing[country]){
      pricing[country] = {};
    }

    pricing[country][weight] = price;
  });

  let select = document.getElementById("country");
  countries.forEach(c=>{
    let opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });

  document.getElementById("result").innerHTML = "✔ Ready to use";
}

loadPricing();

function calculate(){
  let country = document.getElementById("country").value;
  let w = parseFloat(document.getElementById("weight").value) || 0;
  let l = parseFloat(document.getElementById("length").value) || 0;
  let wi = parseFloat(document.getElementById("width").value) || 0;
  let h = parseFloat(document.getElementById("height").value) || 0;

  let vol = (l * wi * h) / 5000;
  let charge = Math.max(w, vol);
  charge = Math.ceil(charge * 10) / 10;

  let table = pricing[country];

  if(!table){
    document.getElementById("result").innerHTML = "No pricing available";
    return;
  }

  let keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let finalWeight = keys.find(k => k >= charge) || keys[keys.length-1];
  let price = table[finalWeight];

  document.getElementById("result").innerHTML =
  `Chargeable weight: <b>${charge} kg</b><br>
   Shipping cost: <b>${price} THB</b><br>
   <div class="badge">✔ Tax included • No hidden fees</div>`;
}
</script>

</body>
</html>
